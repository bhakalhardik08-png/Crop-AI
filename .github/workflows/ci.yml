name: Project checks

on:
  push:
    branches: [main]
  pull_request:

jobs:
  syntax:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Compile inference code
        run: python -m py_compile src/predict.py
      - name: Validate demo notebook JSON
        run: python -m json.tool notebook/Crop_AI_Inference_Demo.ipynb > /dev/null
